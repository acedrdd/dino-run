name: Build (Website + Android APK)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy web files into www/
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare icon source
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon.png

      - name: Generate launcher icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0a1128' --iconBackgroundColorDark '#0a1128'

      - name: Fullscreen theme + vibration permission
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/res/values/styles.xml")
          s = p.read_text()
          extra = """
              <item name="android:windowFullscreen">true</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>"""
          s = re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', r'\1' + extra, s, count=1)
          p.write_text(s)
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text()
          if "android.permission.VIBRATE" not in t:
              t = t.replace("</manifest>", '    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>')
          m.write_text(t)
          PY

      - name: Enable 90/120 Hz, immersive mode and keep-screen-on
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          pkg=$(grep -m1 '^package' "$f")
          cat > /tmp/body.java <<'JAVA'

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              requestHighRefreshRate();
              hideSystemBars();
            }

            @Override
            public void onResume() {
              super.onResume();
              requestHighRefreshRate();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemBars();
            }

            private void hideSystemBars() {
              try {
                getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              } catch (Throwable ignored) {}
            }

            // Ask Android for the highest refresh rate the screen supports at its current resolution.
            private void requestHighRefreshRate() {
              try {
                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;
                Display display = getWindowManager().getDefaultDisplay();
                Display.Mode current = display.getMode();
                Display.Mode best = current;
                for (Display.Mode m : display.getSupportedModes()) {
                  if (m.getPhysicalWidth() == current.getPhysicalWidth()
                      && m.getPhysicalHeight() == current.getPhysicalHeight()
                      && m.getRefreshRate() > best.getRefreshRate()) {
                    best = m;
                  }
                }
                WindowManager.LayoutParams p = getWindow().getAttributes();
                p.preferredDisplayModeId = best.getModeId();
                p.preferredRefreshRate = best.getRefreshRate();
                getWindow().setAttributes(p);
              } catch (Throwable ignored) {}
            }
          }
          JAVA
          { echo "$pkg"; cat /tmp/body.java; } > "$f"
          cat "$f" | head -20

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dino-run.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dino-run-apk
          path: dino-run.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dino-run.apk

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir site
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
