# Place at: .github/workflows/build.yml
name: Build Dino Run

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 6 = Java 17 + Gradle 8.2 (stable, no JDK 21 surprises)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v2.0 zip shipped package.json and sw.js as EMPTY (0 byte) files,
      # which breaks npm and the offline cache. Recreate them if empty.
      - name: Repair empty package.json / sw.js
        run: |
          if [ ! -s package.json ]; then
            echo "package.json missing/empty - regenerating"
            cat > package.json <<'JSON'
          {
            "name": "dino-run",
            "version": "2.0.0",
            "private": true,
            "description": "Endless dino runner",
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          JSON
          fi
          if [ ! -s sw.js ]; then
            echo "sw.js missing/empty - regenerating"
            cat > sw.js <<'JS'
          const CACHE = 'dino-run-v10';
          const ASSETS = ['./', './index.html', './manifest.webmanifest',
            './icon-192.png', './icon-512.png'];
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
            self.skipWaiting();
          });
          self.addEventListener('activate', e => {
            e.waitUntil(caches.keys().then(keys =>
              Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
            self.clients.claim();
          });
          self.addEventListener('fetch', e => {
            if (e.request.method !== 'GET') return;
            e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
          });
          JS
          fi
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Prepare www folder
        run: |
          rm -rf www && mkdir www
          cp index.html sw.js manifest.webmanifest icon-*.png www/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*debug*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" dino-run.apk
          ls -lh dino-run.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dino-run-apk
          path: dino-run.apk
          if-no-files-found: error

      - name: Publish release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dino-run.apk

  pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    continue-on-error: true   # don't turn the run red if Pages isn't enabled
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir site
          cp index.html manifest.webmanifest icon-*.png site/
          if [ -s sw.js ]; then cp sw.js site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
