<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Dino Run</title>
<meta name="description" content="An endless dino runner with power-ups: armor that explodes obstacles, slow-mo, ghost mode and more." />
<meta name="theme-color" content="#0a1128" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<style>

  :root, :root[data-theme="night"] {
    color-scheme: dark;
    --background: #0a1128;
    --foreground: #dfe7ff;
    --card: #101a3a;
    --primary: #dfe7ff;
    --primary-foreground: #0a1128;
    --secondary: #16224b;
    --secondary-foreground: #c3d0f5;
    --muted-foreground: #8f9dc7;
    --accent: #8fb0ff;
    --gold: #f0d58a;
    --success: #4fd08a;
    --border: #1f2e5e;
    --grid-line: rgba(143, 176, 255, 0.05);
    --glow: rgba(88, 120, 235, 0.28);
    --header-bg: rgba(10, 17, 40, 0.94);
    --star: rgba(223, 231, 255, 0.85);
    --radius: 1rem;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --background: #121110;
    --foreground: #efe9dd;
    --card: #1a1816;
    --primary: #efe9dd;
    --primary-foreground: #121110;
    --secondary: #24211d;
    --secondary-foreground: #d9d2c4;
    --muted-foreground: #9a9183;
    --accent: #e8903f;
    --gold: #e6b84f;
    --success: #4fbf78;
    --border: #2e2a25;
    --grid-line: rgba(232, 144, 63, 0.05);
    --glow: rgba(232, 144, 63, 0.16);
    --header-bg: rgba(18, 17, 16, 0.94);
    --star: transparent;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-color: var(--border); }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
body { background: var(--background); color: var(--foreground); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: none; }

.game { position: fixed; inset: 0; background: var(--background); overflow: hidden; }
.stage {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--background);
  --pt: env(safe-area-inset-top, 0px); --pr: env(safe-area-inset-right, 0px); --pb: env(safe-area-inset-bottom, 0px); --pl: env(safe-area-inset-left, 0px);
}
.stage.rot { --pt: 0px; --pr: 0px; --pb: 0px; --pl: 0px; }
canvas { display: block; background: var(--background); touch-action: none; -webkit-tap-highlight-color: transparent; }

/* top bar */
.g-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: max(0.6rem, var(--pt)) max(0.9rem, var(--pr)) 0.6rem max(0.9rem, var(--pl)); z-index: 3; }
.g-title { font-size: 1.15rem; white-space: nowrap; }
.g-btns { display: flex; gap: 0.5rem; }
.g-chip { height: 2.5rem; min-width: 2.5rem; padding: 0 0.9rem; border-radius: 9999px; border: 1px solid var(--border); background: rgba(10, 17, 40, 0.72); color: #dfe7ff; font-size: 0.85rem; font-weight: 600; }
.g-chip:active { border-color: var(--accent); color: var(--accent); }
.g-info { white-space: nowrap; display: flex; gap: 1rem; padding: 0.45rem 0.95rem; border-radius: 9999px; background: rgba(10, 17, 40, 0.72); color: #dfe7ff; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.95rem; letter-spacing: 0.08em; }
.g-info #g-hi { color: #9fb0e0; }

/* buttons */
.g-btn { border: 2px solid var(--accent); background: rgba(10, 17, 40, 0.62); color: #fff; font-weight: 800; letter-spacing: 0.04em; border-radius: 1.25rem; transition: background-color 0.12s, transform 0.12s, opacity 0.2s; }
.g-btn.on, .g-btn:active { background: var(--accent); color: #0a1128; transform: scale(0.96); }
.g-btn.jump { border-color: var(--gold); }
.g-btn.jump.on, .g-btn.jump:active { background: var(--gold); }
.g-btn.pow:not(.ready) { opacity: 0.55; }
.g-btn.pow.ready { background: var(--gold); border-color: var(--gold); color: #1a1405; animation: pow-pulse 1s ease-in-out infinite; }
@keyframes pow-pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--gold) 30%, transparent); } }
@media (prefers-reduced-motion: reduce) { .g-btn.pow.ready { animation: none; } }

/* ---------- LANDSCAPE: full-screen canvas, controls floating on top ---------- */
.stage.land .g-view { position: absolute; inset: 0; }
.stage.land canvas { width: 100%; height: 100%; }
.stage.land .g-top { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; }
.stage.land .g-top > * { pointer-events: auto; }
.stage.land .g-title { display: none; }
.stage.land .g-controls {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none;
  display: flex; align-items: flex-end; gap: 0.75rem;
  padding: 0 max(1rem, var(--pr)) max(0.9rem, var(--pb)) max(1rem, var(--pl));
}
.stage.land .g-controls > * { pointer-events: auto; }
.stage.land .g-btn.duck { width: 6.2rem; height: 5rem; }
.stage.land .g-btn.pow { margin-left: auto; width: 7.5rem; height: 5rem; font-size: 0.85rem; }
.stage.land .g-btn.jump { width: 8.5rem; height: 5rem; font-size: 1.1rem; }

/* ---------- PORTRAIT: canvas on top, big thumb buttons below ---------- */
.stage.port { display: flex; flex-direction: column; }
.stage.port .g-view { flex: 0 0 auto; }
.stage.port canvas { width: 100%; height: auto; }
.stage.port .g-controls {
  flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 2fr 1fr; gap: 0.75rem;
  padding: 0.9rem max(1rem, var(--pr)) max(1rem, var(--pb)) max(1rem, var(--pl));
}
.stage.port .g-btn.jump { grid-column: 1 / -1; grid-row: 1; font-size: 1.5rem; }
.stage.port .g-btn.duck { grid-column: 1; grid-row: 2; font-size: 1rem; }
.stage.port .g-btn.pow { grid-column: 2; grid-row: 2; font-size: 1rem; }
.stage.port .g-title .tt { display: none; }
.stage.port .g-info { font-size: 0.85rem; gap: 0.7rem; }

/* ---------- coins, fps, settings panel ---------- */
[hidden] { display: none !important; }
.cd { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; margin-right: 0.35em; vertical-align: -0.06em; background: radial-gradient(circle at 35% 35%, #fff2b0, #f0c43a 55%, #b8860b); box-shadow: inset 0 0 0 0.08em rgba(120, 80, 0, 0.5); }
.g-coins { color: var(--gold); cursor: pointer; }
.g-fps { position: absolute; right: max(0.9rem, var(--pr)); top: calc(max(0.6rem, var(--pt)) + 2.9rem); z-index: 3; font: 600 11px ui-monospace, Menlo, Consolas, monospace; color: #9fe8b8; background: rgba(10, 17, 40, 0.6); padding: 0.15rem 0.5rem; border-radius: 9999px; pointer-events: none; }
.stage.port #game-rotate, .stage.port #game-sound { display: none; }
.stage.port .g-chip { min-width: 2.2rem; height: 2.2rem; padding: 0 0.6rem; }
.panel-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(4, 8, 22, 0.78); padding: max(0.6rem, var(--pt)) max(0.8rem, var(--pr)) max(0.6rem, var(--pb)) max(0.8rem, var(--pl)); }
.panel { width: min(640px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 1.1rem; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
.p-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.p-tabs { display: flex; gap: 0.35rem; flex: 1; }
.p-tabs button { height: 2.2rem; padding: 0 0.95rem; border-radius: 9999px; border: 1px solid var(--border); background: transparent; color: var(--muted-foreground); font-weight: 700; font-size: 0.85rem; touch-action: manipulation; }
.p-tabs button.on { background: var(--accent); border-color: var(--accent); color: #0a1128; }
.p-coins { color: var(--gold); font: 800 0.95rem ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
.p-body { padding: 0.5rem 0.9rem 0.8rem; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); column-gap: 1.2rem; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: 0.35rem 0; min-height: 2.7rem; border-bottom: 1px solid rgba(143, 176, 255, 0.09); font-size: 0.9rem; font-weight: 600; }
.row small { display: block; color: var(--muted-foreground); font-size: 0.68rem; font-weight: 500; margin-top: 0.1rem; }
.sw { position: relative; flex: 0 0 auto; width: 2.7rem; height: 1.5rem; border-radius: 9999px; border: 1px solid var(--border); background: var(--secondary); touch-action: manipulation; transition: background-color 0.15s; }
.sw::after { content: ""; position: absolute; top: 0.14rem; left: 0.16rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--muted-foreground); transition: transform 0.15s, background-color 0.15s; }
.sw[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.sw[aria-pressed="true"]::after { transform: translateX(1.2rem); background: #0a1128; }
.seg { display: flex; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 9999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0.4rem 0.62rem; font-size: 0.78rem; font-weight: 700; color: var(--muted-foreground); touch-action: manipulation; }
.seg button.on { background: var(--accent); color: #0a1128; }
.p-body input[type="range"] { width: 8.5rem; accent-color: var(--accent); }
.p-note { color: var(--muted-foreground); font-size: 0.8rem; margin-bottom: 0.6rem; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 0.6rem; }
.skin { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.6rem 0.3rem; border: 1.5px solid var(--border); border-radius: 0.9rem; background: var(--secondary); color: var(--foreground); font-size: 0.82rem; font-weight: 700; touch-action: manipulation; }
.skin.sel { border-color: var(--gold); }
.skin canvas { image-rendering: pixelated; width: 42px; height: 48px; background: transparent; }
.skin .st { font-size: 0.72rem; color: var(--gold); }
.p-msg { min-height: 1.2rem; margin-top: 0.6rem; color: var(--accent); font-size: 0.8rem; font-weight: 600; }

</style>
</head>
<body>

<div class="game show" id="game">
  <div class="stage land" id="stage">
    <header class="g-top">
      <strong class="g-title">&#129430;<span class="tt"> Dino Run</span></strong>
      <div class="g-info"><span id="g-score">00000</span><span id="g-hi">HI 00000</span><span id="g-coins" class="g-coins" title="Coins - tap for skins"></span></div>
      <div class="g-btns">
        <button type="button" class="g-chip" id="game-rotate" aria-label="Switch between landscape and portrait">&#9645; Landscape</button>
        <button type="button" class="g-chip" id="game-sound" aria-label="Toggle sound" aria-pressed="false">&#128266;</button>
        <button type="button" class="g-chip" id="game-pause" aria-label="Pause">&#10074;&#10074;</button>
        <button type="button" class="g-chip" id="game-settings" aria-label="Settings">&#9881;</button>
      </div>
    </header>
    <div class="g-view">
      <canvas id="game-canvas" width="600" height="180" aria-label="Dino jumping game. Press space or tap to jump."></canvas>
    </div>
    <div class="g-controls">
      <button type="button" class="g-btn duck" id="game-duck" aria-label="Crouch">&#11015; CROUCH</button>
      <button type="button" class="g-btn pow" id="game-pow" aria-label="Use power-up">&#9889; Power-up</button>
      <button type="button" class="g-btn jump" id="game-jump" aria-label="Jump">&#11014; JUMP</button>
    </div>
    <div class="g-fps" id="g-fps" hidden></div>
    <div class="panel-wrap" id="panel" hidden>
      <div class="panel" role="dialog" aria-label="Settings">
        <div class="p-head">
          <div class="p-tabs">
            <button type="button" data-tab="set" class="on">Settings</button>
            <button type="button" data-tab="skins">Skins</button>
          </div>
          <div class="p-coins" id="p-coins"></div>
          <button type="button" class="g-chip" id="p-close" aria-label="Close">&#10005;</button>
        </div>
        <div class="p-body" id="tab-set">
          <div class="rows">
            <div class="row"><span>Sound</span><button type="button" class="sw" data-set="sound" aria-pressed="true"></button></div>
            <div class="row"><span>Volume</span><input id="p-vol" type="range" min="0" max="100" step="5" /></div>
            <div class="row"><span>Vibration<small>Haptics on crash, blast and fire</small></span><button type="button" class="sw" data-set="haptics" aria-pressed="true"></button></div>
            <div class="row"><span>Frame rate<small>Auto follows your screen (up to 120)</small></span><div class="seg" data-set="fps"><button type="button" data-v="0">Auto</button><button type="button" data-v="30">30</button><button type="button" data-v="60">60</button><button type="button" data-v="90">90</button><button type="button" data-v="120">120</button></div></div>
            <div class="row"><span>Graphics<small>Lower is smoother on slow phones</small></span><div class="seg" data-set="quality"><button type="button" data-v="0">Low</button><button type="button" data-v="1">Med</button><button type="button" data-v="2">High</button></div></div>
            <div class="row"><span>Show FPS</span><button type="button" class="sw" data-set="showFps" aria-pressed="false"></button></div>
            <div class="row"><span>Orientation</span><div class="seg" data-set="mode"><button type="button" data-v="landscape">Landscape</button><button type="button" data-v="portrait">Portrait</button></div></div>
            <div class="row"><span>Progress<small>Resets hi-score, coins and skins</small></span><button type="button" class="g-chip" id="p-reset">Reset progress</button></div>
          </div>
        </div>
        <div class="p-body" id="tab-skins" hidden>
          <p class="p-note">You earn 1 coin for every 5 points. Tap a skin to buy or equip it.</p>
          <div class="skins" id="skins"></div>
          <div class="p-msg" id="p-msg"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    var modal = document.getElementById("game"), canvas = document.getElementById("game-canvas");
    var ctx = canvas.getContext("2d", { alpha: false, desynchronized: true }) || canvas.getContext("2d");
    var elScore = document.getElementById("g-score"), elHi = document.getElementById("g-hi");
    var soundBtn = document.getElementById("game-sound");
    var W = 600, H = 180, GROUND = 150, U = 3;
    var QUALITY_CAP = [1.25, 2, 3];
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    var settings = { vol: 0.8, haptics: true, fps: 0, quality: 1, showFps: false };
    try { var sv = JSON.parse(load("dinoSettings") || "{}"); for (var sk in sv) if (sk in settings && typeof sv[sk] === typeof settings[sk]) settings[sk] = sv[sk]; } catch (e) {}
    function saveSettings() { store("dinoSettings", JSON.stringify(settings)); }
    var dprCap = QUALITY_CAP[settings.quality] || 2, capMs = settings.fps ? 1000 / settings.fps : 0;
    function buzz(ms) { if (settings.haptics && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
    var SKINS = [
      { id: "classic", name: "Classic", price: 0, day: null, night: null },
      { id: "ocean", name: "Ocean", price: 100, day: "#1f6fb5", night: "#7fc4ff" },
      { id: "lava", name: "Lava", price: 250, day: "#c2371b", night: "#ff8a5a" },
      { id: "neon", name: "Neon", price: 500, day: "#0b9a62", night: "#5dffb0" },
      { id: "gold", name: "Gold", price: 1000, day: "#b8860b", night: "#ffd94a" }
    ];
    var bank = Math.max(0, parseInt(load("dinoCoins"), 10) || 0), owned = ["classic"], skinId = load("dinoSkin") || "classic";
    try { var ow = JSON.parse(load("dinoOwned") || "[]"); if (Array.isArray(ow) && ow.length) owned = ow; } catch (e) {}
    if (owned.indexOf("classic") < 0) owned.push("classic");
    function skinById(id) { for (var i = 0; i < SKINS.length; i++) if (SKINS[i].id === id) return SKINS[i]; return SKINS[0]; }
    if (owned.indexOf(skinId) < 0) skinId = "classic";
    function saveProgress() { store("dinoCoins", String(bank)); store("dinoOwned", JSON.stringify(owned)); store("dinoSkin", skinId); }
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var DINO = [
      ".......######.", ".......#.#####", ".......#######", ".......#######", ".......####...",
      "#.....#####...", "#....######.#.", "##..########..", ".###########..", "..##########..",
      "...########...", "....######....", ".....####....."
    ];
    var DW = 14 * U, DH = 16 * U;
    var MSGS = ["Skill issue \uD83E\uDD96", "The cactus sends its regards", "Hire Jake anyway", "So close. Not really.", "Have you tried jumping?", "Ouch. That one was spiky"];
    var MILESTONE = 1000, FREEZE = 1.0, NIGHT_EVERY = 600, UNLOCK = 2000, DRAGON_AT = 4000, COIN_EVERY = 5, FIRE_LEN = 190;

    /* ---------- colours: day <-> night ---------- */
    function hex(h) { h = h.replace("#", ""); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
    var mixCache = {};
    function mix(a, b, t) {
      t = Math.round(t * 64) / 64;
      var key = a + b + t, hit = mixCache[key]; if (hit) return hit;
      var A = hex(a), B = hex(b);
      return (mixCache[key] = "rgb(" + Math.round(A[0] + (B[0] - A[0]) * t) + "," + Math.round(A[1] + (B[1] - A[1]) * t) + "," + Math.round(A[2] + (B[2] - A[2]) * t) + ")");
    }

    /* ---------- sound (WebAudio, no files) ---------- */
    var actx = null, muted = false;
    try { muted = localStorage.getItem("dinoMute") === "1"; } catch (e) {}
    function audio() {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; try { actx = new AC(); } catch (e) { return null; } }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }
    function tone(f1, f2, dur, vol, delay) {
      if (muted || settings.vol <= 0) return;
      var a = audio(); if (!a) return;
      var t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
      o.type = "square"; o.frequency.setValueAtTime(f1, t);
      if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol * settings.vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
    }
    function sfxJump() { tone(420, 840, 0.13, 0.05, 0); }
    function sfxMilestone() { tone(660, 660, 0.09, 0.06, 0); tone(880, 880, 0.09, 0.06, 0.11); tone(1320, 1320, 0.2, 0.06, 0.22); }
    function sfxPickup() { tone(700, 700, 0.07, 0.05, 0); tone(1050, 1400, 0.12, 0.05, 0.08); }
    function sfxActivate() { tone(300, 900, 0.18, 0.06, 0); tone(900, 900, 0.1, 0.05, 0.18); }
    function sfxBoom() { tone(180, 30, 0.45, 0.12, 0); tone(90, 25, 0.5, 0.1, 0.02); tone(520, 60, 0.25, 0.05, 0); }
    function noise(dur, vol, f0, f1) {
      if (muted || settings.vol <= 0) return;
      var a = audio(); if (!a) return;
      var n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      var t = a.currentTime, src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf; flt.type = "lowpass";
      flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol * settings.vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(a.destination); src.start(t);
    }
    function sfxRoar() { tone(150, 70, 0.35, 0.07, 0); tone(120, 55, 0.4, 0.06, 0.05); }
    function sfxFire() { noise(0.8, 0.16, 2600, 300); tone(110, 60, 0.5, 0.05, 0); }
    function syncSound() { soundBtn.innerHTML = muted ? "&#128263;" : "&#128266;"; soundBtn.setAttribute("aria-pressed", String(muted)); soundBtn.title = muted ? "Sound off" : "Sound on"; }

    /* ---------- state ---------- */
    var hi = 0; try { hi = +localStorage.getItem("dinoHi") || 0; } catch (e) {}
    var state = "idle", raf = 0, last = 0, frame = 0;
    var dino, obstacles, clouds, stars, speed, score, distance, nextGap, groundX, msg, overAt, holdDown = false;
    var nightMix = 0, nextMilestone = MILESTONE, freezeT = 0, frozenValue = 0, unlocked = false, bannerT = 0, sinceSpawn = 0;
    var dragonUnlocked = false, bannerMsg = "", runCoins = 0, paused = false, panelOpen = false, resumeT = 0;

    /* ---------- power-ups ---------- */
    var POWERS = {

      if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 8 * Math.min(1, shakeT * 3), (Math.random() - 0.5) * 6 * Math.min(1, shakeT * 3));

    soundBtn.addEventListener("click", function () {

        canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); jump(); });

            if (e.code === "Space" || e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); if (!e.repeat) jump(); }

    /* ---------- adaptive layout: landscape <-> portrait ---------- */

        syncPanel(); return;
